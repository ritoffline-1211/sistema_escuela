name: Pruebas PHPUnit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Composer exige PHP >= 8.1; se comprueban las versiones soportadas.
        php-version: ['8.1', '8.2', '8.3', '8.4']

    # Base de datos desechable: credenciales triviales, sin secrets ni DB externa.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utest -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: testing
      DB_USER: test
      DB_PASS: test
      TEST_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, mysqli, pdo, pdo_mysql, curl, zip, xml, dom, tokenizer
          coverage: xdebug
          tools: composer:v2

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Preparar configuración de pruebas
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env.testing
          fi
          # Este proyecto no usa APP_KEY (no es Laravel): phpunit.xml fuerza
          # APP_ENV=testing y la conexión a la base desechable "testing".

      - name: Comprobar la base de datos de prueba
        run: |
          php -r '
          $conexion = @mysqli_connect("127.0.0.1", "test", "test", "testing", 3306);
          if (!$conexion) {
              fwrite(STDERR, "No se pudo conectar con la base de datos de prueba.\n");
              exit(1);
          }
          echo "Base de datos de prueba disponible.\n";
          '

      - name: Instalar dependencias con Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ejecutar suite PHPUnit con reportes
        run: |
          mkdir -p build/coverage
          XDEBUG_MODE=coverage vendor/bin/phpunit --colors=always --testdox \
            --coverage-clover build/coverage/clover.xml \
            --log-junit build/junit.xml

      - name: Subir reportes JUnit y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-php-${{ matrix.php-version }}
          path: |
            build/junit.xml
            build/coverage/clover.xml
          if-no-files-found: warn
